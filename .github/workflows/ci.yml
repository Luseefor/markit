name: Rust
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, aarch64-linux-android
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p markit-wasm --release --locked --target wasm32-unknown-unknown
      - run: cargo check -p markit-ffi --locked --target aarch64-linux-android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - run: cargo build -p markit-ffi --release --locked --target aarch64-apple-ios
      - run: cargo build -p markit-ffi --release --locked --target aarch64-apple-ios-sim
      - run: swift build --package-path platforms/ios

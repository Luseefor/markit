[package]
name = "markit-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly Markdown rendering bindings"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
markit.workspace = true
wasm-bindgen = "0.2"
serde_json.workspace = true

[features]
# Editors reach LineHighlighter through this module, so the web package ships
# the grammar highlighter by default.
default = ["grammars"]
grammars = ["markit/grammars"]

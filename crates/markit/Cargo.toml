[package]
name = "markit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Markdown engine for native text and WebAssembly"

[dependencies]
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"], optional = true }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"], optional = true }
latex-rust = { version = "=2.1.1", features = ["png"] }
base64 = "0.22"
linkify = "0.10"
unicase = "2"

[[bench]]
name = "throughput"
harness = false

[features]
default = []
grammars = ["dep:syntect", "dep:two-face"]
